name: PR Checks
on:
  - pull_request

permissions:
  actions: none
  attestations: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: read
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  check-cooldown-excludes:
    name: Cooldown exclude allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: minimumReleaseAgeExclude must be @rvoh/* only
        run: |
          # SECURITY: the minimumReleaseAge cooldown bypass list must stay @rvoh/*
          # only (our own packages). Any third-party entry is a permanent
          # supply-chain bypass and must be rejected — apply urgent patches via a
          # transient, reverted override instead of a persistent exclude.
          bad=$(grep -nE '^[[:space:]]*minimumReleaseAgeExclude' .npmrc | grep -vE '=[[:space:]]*@rvoh/' || true)
          if [ -n "$bad" ]; then
            echo "::error::Non-@rvoh minimumReleaseAgeExclude entries (cooldown bypass must stay @rvoh/* only):"
            echo "$bad"
            exit 1
          fi

  uspec:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 26 is the primary target; 24 is the oldest supported runtime
        node-version: ["26", "24"]
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: psychic
          POSTGRES_DB: psychic_workers_test
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:6.2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      PORT: 7777
      DB_USER: psychic
      DB_NAME: psychic_workers_test
      DB_HOST: localhost
      DB_PASSWORD: postgres
      DB_PORT: 5432
      TZ: UTC
      GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
      LEGACY_APP_ENCRYPTION_KEY: ${{ secrets.LEGACY_APP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm psy db:migrate --skip-sync
      - run: pnpm uspec

  lint:
    name: Linting
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  check-build:
    name: Check build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["26", "24"]
    env:
      NODE_ENV: development
      GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Load the built package as both ESM and CJS
        run: |
          for sub in "" /errors /types /utils; do
            node --input-type=module -e "await import('@rvoh/psychic-workers$sub')"
            node -e "require('@rvoh/psychic-workers$sub')"
          done
      - run: pnpm build:test-app

  check-no-sync-diff:
    name: Ensure no sync diffs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: psychic
          POSTGRES_DB: psychic_workers_test
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:6.2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      PORT: 7777
      DB_USER: psychic
      DB_NAME: psychic_workers_test
      DB_HOST: localhost
      DB_PASSWORD: postgres
      DB_PORT: 5432
      TZ: UTC
      GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
      LEGACY_APP_ENCRYPTION_KEY: ${{ secrets.LEGACY_APP_ENCRYPTION_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm psy db:migrate --skip-sync
      - run: pnpm psy sync
      - name: Check for sync differences
        run: |
          if [ -n "$(git diff)" ]; then
            echo "Error: 'pnpm psy sync' produced changes. Please run 'pnpm psy sync' locally and commit the changes."
            echo "Changes detected:"
            git diff
            exit 1
          else
            echo "No changes detected after sync - all good!"
          fi
